        <input id="set-reserve" type="number" min="0" max="60" step="5" value="${Math.round(S.reserveShare * 100)}" data-set="reserveShare">
        <span class="hint">Percent of each day the nearest exam may not take while other work is open.</span></div>
      <div class="field"><label for="set-window">Exam chain window</label>
        <input id="set-window" type="number" min="2" max="45" value="${S.clusterWindow}" data-set="clusterWindow">
        <span class="hint">Exams closer than this many days chain into one exam period.</span></div>
      <div class="field"><label for="set-min">Exams before “high density”</label>
        <input id="set-min" type="number" min="2" max="8" value="${S.clusterMin}" data-set="clusterMin">
        <span class="hint">A chain this long raises the density alert.</span></div>
      <div class="field"><label for="set-tight">Tight-turnaround gap</label>
        <input id="set-tight" type="number" min="0" max="7" value="${S.tightGap}" data-set="tightGap">
        <span class="hint">Days between two exams that counts as a clash.</span></div>
      <div class="field"><label for="set-rem">Exam reminders (days before)</label>
        <input id="set-rem" type="text" value="${S.reminders.join(", ")}" data-setlist="reminders">
        <span class="hint">Created only for confirmed dates.</span></div>
      <div class="field"><label for="set-wrem">Hand-in reminders (days before)</label>
        <input id="set-wrem" type="text" value="${S.workReminders.join(", ")}" data-setlist="workReminders"></div>
      <div class="field"><label for="set-sem">Semester label</label>
        <input id="set-sem" type="text" value="${esc(S.semester)}" data-settext="semester"></div>
    </div>
  </div>
  <div class="module">
    <header><h2>Data</h2></header>
    <div class="body srow">
      <button class="btn" type="button" data-reset="1">Restore semester defaults</button>
      <button class="btn" type="button" data-export="1">Copy data as JSON</button>
      <span class="hint" style="flex:1 1 220px">${state.backend === "db" ? "Changes sync to this artifact's store and are visible wherever you open it." : "Changes are stored in this browser only."}</span>
    </div>
  </div>`;
}

/* ==========================================================================
   Course editor
   ========================================================================== */
let editing = null;
function openEditor(id) {
  const c = state.courses.find(x => x.id === id);
  if (!c) return;
  editing = JSON.parse(JSON.stringify(c));
  drawEditor();
}
function newCourse() {
  editing = normaliseCourse({ id: uid("c"), name: "", credits: 5, assessment: "Exam", dateState: "tbd", examDate: null, estimatedDate: null, group: "", prep: { est: 10, done: 0, topics: [] }, deliverables: [], isNew: true });
  drawEditor();
}

function drawEditor() {
  // redrawing the sheet re-runs the projection; hold onto the focused control
  const act = document.activeElement;
  const keepId = act && act.id && document.getElementById("scrim")?.contains(act) ? act.id : null;
  const c = editing;
  const isExamType = c.dateState !== "none";
  const rem = remaining(c);
  const live = M.courses.find(x => x.id === c.id);
  const sch = schedule(c);
  const projected = sch.date ? projectRisk(c) : null;
  const groupNames = [...new Set(state.courses.map(x => x.group).filter(Boolean))];

  document.getElementById("scrim").hidden = false;
  document.getElementById("scrim").innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Edit course">
    <header><h2>${c.isNew ? "New course" : esc(c.name || "Course")}</h2>
      <button class="btn ghost sm" type="button" data-close="1" aria-label="Close">✕</button></header>
    <div class="sbody">
      <div class="grid2">
        <div class="field" style="grid-column:1/-1"><label for="e-name">Course name</label><input id="e-name" type="text" value="${esc(c.name)}" data-f="name" placeholder="e.g. Differential Calculus"></div>
        <div class="field"><label for="e-cred">Credits (ECTS)</label><input id="e-cred" type="number" min="0" max="60" step="0.5" value="${c.credits}" data-f="credits"></div>
        <div class="field"><label for="e-assess">Assessment type</label>
          <select id="e-assess" data-f="assessment">
            ${["Exam", "Oral exam", "Exercises / Coursework", "Coursework", "Project", "Portfolio"].map(a => `<option ${a === c.assessment ? "selected" : ""}>${a}</option>`).join("")}
          </select></div>
        <div class="field"><label for="e-group">Subject area</label>
          <input id="e-group" type="text" list="grouplist" value="${esc(c.group || "")}" data-f="group" placeholder="e.g. Mathematics">
          <datalist id="grouplist">${groupNames.map(g => `<option value="${esc(g)}"></option>`).join("")}</datalist></div>
      </div>

      <fieldset>
        <legend>Exam date</legend>
        <div class="seg" role="group" aria-label="Date state">
          <button type="button" data-state="confirmed" aria-pressed="${c.dateState === "confirmed"}">Confirmed date</button>
          <button type="button" data-state="tbd" aria-pressed="${c.dateState === "tbd"}">TBD</button>
          <button type="button" data-state="none" aria-pressed="${c.dateState === "none"}">No exam</button>
        </div>
        ${c.dateState === "confirmed" ? `
          <div class="field"><label for="e-date">Date</label><input id="e-date" type="date" value="${c.examDate || ""}" data-f="examDate"></div>
          ${c.examDate ? `<p class="hint" style="margin:0">Counting down, on the calendar, reminders at ${state.settings.reminders.join(", ")} days out, milestones generated, risk and workload included.</p>` : `<p class="hint" style="margin:0">Pick a date to switch on the countdown and reminders.</p>`}
        ` : c.dateState === "tbd" ? `
          <p class="hint" style="margin:0"><strong>Exam date TBD.</strong> No countdown is shown and no reminders are created. You may add an expected date — it is planned against provisionally and clearly marked as an estimate, but never reminded on.</p>
          <div class="grid2">
            <div class="field"><label for="e-est">Expected date (optional)</label><input id="e-est" type="date" value="${c.estimatedDate || ""}" data-f="estimatedDate" min="${iso(today())}"></div>
            <div class="field"><label for="e-real">Announced date → confirm</label><input id="e-real" type="date" value="" data-confirmfield="1" min="${iso(today())}"></div>
          </div>
          <p class="hint" style="margin:0">Entering an announced date flips this course to confirmed and recalculates everything.</p>
        ` : `
          <p class="hint" style="margin:0"><strong>No exam.</strong> Nothing counts down. This course is managed entirely through its assignments, exercises, projects and coursework deadlines below.</p>
        `}
      </fieldset>

      ${isExamType ? `
      <fieldset>
        <legend>Preparation</legend>
        <div class="grid2">
          <div class="field"><label for="e-est-h">Estimated preparation</label><input id="e-est-h" type="number" min="0" max="500" step="0.5" value="${c.prep.est}" data-f="prep.est"></div>
          <div class="field"><label for="e-done-h">Preparation completed</label><input id="e-done-h" type="number" min="0" max="500" step="0.5" value="${c.prep.done}" data-f="prep.done"></div>
          <div class="field"><label>Preparation remaining</label>
            <div class="mono" style="padding:7px 0;font-size:18px;font-weight:600">${hrs(rem)}</div></div>
        </div>
        ${projected ? projectionPanel(projected, rem) : `<p class="hint" style="margin:0">Set a date to see whether your remaining hours actually fit.</p>`}
        <div>
          <div class="eyebrow" style="margin-bottom:7px">Topics</div>
          <div class="topiclist">
            ${(c.prep.topics || []).map((t, i) => `<div class="topic ${t.done ? "done" : ""}">
              <input type="checkbox" id="tp-${i}" ${t.done ? "checked" : ""} data-topic="${i}" aria-label="Mark “${esc(t.name)}” covered">
              <input type="text" value="${esc(t.name)}" data-topicname="${i}" aria-label="Topic name">
              <button class="btn ghost sm" type="button" data-topicdel="${i}" aria-label="Remove topic">✕</button></div>`).join("") || `<div class="topic" style="color:var(--ink-3);font-size:12.5px">No topics yet.</div>`}
          </div>
          <button class="btn sm" type="button" data-topicadd="1" style="margin-top:8px">+ Add topic</button>
        </div>
      </fieldset>` : ""}

      <fieldset>
        <legend>Assignments, exercises &amp; coursework</legend>
        <div class="dlist">
          <div class="drow" style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)">
            <span>Done</span><span>Title</span><span>Due (blank = TBD)</span><span>Hours</span><span></span></div>
          ${c.deliverables.map((d, i) => `<div class="drow">
            <input type="checkbox" ${d.done ? "checked" : ""} data-ddone="${i}" aria-label="Mark ${esc(d.title)} submitted">
            <input type="text" value="${esc(d.title)}" data-dtitle="${i}" aria-label="Title">
            <input type="date" value="${d.due || ""}" data-ddue="${i}" aria-label="Due date">
            <input type="number" min="0" step="0.5" value="${d.hours || 0}" data-dhours="${i}" aria-label="Hours of work">
            <button class="btn ghost sm" type="button" data-ddel="${i}" aria-label="Remove">✕</button></div>`).join("")}
        </div>
        <button class="btn sm" type="button" data-dadd="1">+ Add item</button>
        ${c.deliverables.some(d => !d.due && !d.done) ? `<p class="hint" style="margin:0">Items with no date show as <strong>deadline TBD</strong> — no countdown, no reminders — until you set one.</p>` : ""}
      </fieldset>
    </div>
    <footer>
      <button class="btn pri" type="button" data-save="1">Save</button>
      <button class="btn" type="button" data-close="1">Cancel</button>
      ${c.isNew ? "" : `<button class="btn danger sp" type="button" data-delete="1">Delete course</button>`}
    </footer>
  </div>`;
  if (keepId) { const back = document.getElementById(keepId); if (back) { back.focus(); const n = back.value?.length; try { back.setSelectionRange(n, n); } catch {} } }
  else { const f = document.getElementById("e-name"); if (c.isNew && f) f.focus(); }
}

/** What the risk would be if this edit were saved — recomputed against a cloned state. */
function projectRisk(c) {
  const backup = state.courses;
  state.courses = state.courses.map(x => x.id === c.id ? JSON.parse(JSON.stringify(c)) : x);
  if (!backup.some(x => x.id === c.id)) state.courses = [...state.courses, JSON.parse(JSON.stringify(c))];
  let out = null;
  try { const m = computeAll(); out = m.courses.find(x => x.id === c.id); }
  finally { state.courses = backup; }
  return out;
}

function projectionPanel(p, rem) {
  if (!p || !p.sched.date) return "";
  const short = p.deficit > 0.05;
  const cls = short ? (p.risk.key === "crit" ? "crit" : "high") : "low";
  return `<div class="alert ${cls}" style="align-items:center">
    ${svgIc(short ? '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>' : '<path d="M20 6L9 17l-5-5"/>').replace('class="ic"', 'class="ico"')}
    <span class="txt">
      <b>${p.risk.label}${p.sched.firm ? "" : " · based on an expected date"}</b>
      <p class="mono" style="font-size:12px">Exam ${fmtShort(p.sched.date)} · ${p.days} days out · preparation remaining <strong>${hrs(rem)}</strong> · available study time <strong>${hrs(p.avail)}</strong></p>
      <p>${short
        ? `You need roughly <strong>${hrs(p.deficit)}</strong> more study time than the plan can find before this exam. Free up capacity, cut the estimate, or start earlier.`
        : `The plan finds enough time for this exam alongside everything else.`}</p>
      ${p.risk.reasons.length ? `<p class="mono" style="font-size:11px">${p.risk.reasons.map(r => "· " + esc(r)).join("<br>")}</p>` : ""}
    </span></div>`;
}

function closeEditor() { editing = null; const s = document.getElementById("scrim"); s.hidden = true; s.innerHTML = ""; }

function commitEditor() {
  const c = editing;
  if (!c.name.trim()) { toast("Give the course a name first."); return; }
  c.credits = Number(c.credits) || 0;
  normaliseCourse(c);
  delete c.isNew;
  const i = state.courses.findIndex(x => x.id === c.id);
  if (i >= 0) state.courses[i] = c; else state.courses.push(c);
  save(c);
  closeEditor();
  render();
  toast(`${c.name} saved.`);
}

/* ==========================================================================
   The TBD → confirmed transition, which is the whole point of the deck
   ========================================================================== */
function confirmDate(id, dateStr) {
  const c = state.courses.find(x => x.id === id);
  if (!c || !dateStr) { toast("Pick a date first."); return; }
  c.dateState = "confirmed";
  c.examDate = dateStr;
  c.estimatedDate = null;
  save(c);
  render();
  const live = M.courses.find(x => x.id === id);
  const cl = M.clusters.find(x => x.exams.some(e => e.id === id));
  const clash = M.conflicts.find(k => k.ids.includes(id));
  toast(`${c.name} confirmed for ${fmtLong(dateStr)} — ${live.days} days out. ${live.deficit > 0.05 ? `Short ${hrs(live.deficit)}.` : "Study plan covers it."}${clash ? " Clash detected." : ""}${cl && cl.dense ? " Now part of a dense exam period." : ""}`, 6500);
  if (VIEW === "dash") document.querySelector('[data-nav="dash"]')?.scrollIntoView({ block: "nearest" });
}

/* ==========================================================================
   Events
   ========================================================================== */
function toast(msg, ms) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(el._t); el._t = setTimeout(() => el.hidden = true, ms || 3200);
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, .ev");
  if (!t) return;
  const d = t.dataset;

  if (d.nav) { VIEW = d.nav; render(); window.scrollTo({ top: 0, behavior: "instant" }); return; }
  if (d.edit) { openEditor(d.edit); return; }
  if (d.add) { newCourse(); return; }
  if (d.close) { closeEditor(); return; }
  if (d.save) { commitEditor(); return; }
  if (d.delete) {
    const c = editing; closeEditor();
    state.courses = state.courses.filter(x => x.id !== c.id);
    removeRemote(c.id); if (!DB) save();
    render(); toast(`${c.name} removed.`); return;
  }
  if (d.confirm) { confirmDate(d.confirm, document.getElementById("setdate-" + d.confirm).value); return; }
  if (d.expect) {
    const c = state.courses.find(x => x.id === d.expect);
    const v = document.getElementById("setdate-" + d.expect).value;
    if (!v) { toast("Pick a date first."); return; }
    c.dateState = "tbd"; c.estimatedDate = v; c.examDate = null;
    save(c); render();
    toast(`${c.name}: planning provisionally against ${fmtLong(v)}. No reminders until it is confirmed.`, 5000); return;
  }
  if (d.setwork) {
    const [cid, did] = d.setwork.split("|");
    const c = state.courses.find(x => x.id === cid);
    const w = c.deliverables.find(x => x.id === did);
    const v = document.getElementById(`setwork-${cid}-${did}`).value;
    if (!v) { toast("Pick a date first."); return; }
    w.due = v; save(c); render(); toast(`“${w.title}” due ${fmtLong(v)} — reminders at ${state.settings.workReminders.join(", ")} days out.`, 5000); return;
  }
  if (d.state) {
    editing.dateState = d.state;
    if (d.state !== "confirmed") editing.examDate = null;
    if (d.state !== "tbd") editing.estimatedDate = null;
    if (d.state === "none") { editing.assessment = editing.assessment === "Exam" ? "Exercises / Coursework" : editing.assessment; }
    drawEditor(); return;
  }
  if (d.topicadd) { editing.prep.topics.push({ id: uid("t"), name: "New topic", done: false }); drawEditor(); return; }
  if (d.topicdel) { editing.prep.topics.splice(+d.topicdel, 1); drawEditor(); return; }
  if (d.dadd) { editing.deliverables.push({ id: uid("d"), title: "New item", due: null, hours: 4, doneHours: 0, done: false }); drawEditor(); return; }
  if (d.ddel) { editing.deliverables.splice(+d.ddel, 1); drawEditor(); return; }
  if (d.cal !== undefined) {
    if (d.cal === "0") calCursor = new Date(M.T.getFullYear(), M.T.getMonth(), 1);
    else calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + Number(d.cal), 1);
    renderCalendar(); return;
  }
  if (d.reset) {
    if (!confirm("Replace everything on the deck with the original semester data?")) return;
    const fresh = seedCourses();
    const keep = new Set(fresh.map(c => c.id));
    const drop = state.courses.map(c => c.id).filter(id => !keep.has(id));
    state.courses = fresh;
    state.settings = { ...DEFAULT_SETTINGS };
    render();
    // delete the extras first, then write the defaults — the other order races
    Promise.all(drop.map(removeRemote)).then(pushAll).then(() => { render(); toast("Semester defaults restored."); });
    return;
  }
  if (d.export) {
    const json = JSON.stringify({ courses: state.courses, settings: state.settings }, null, 2);
    navigator.clipboard?.writeText(json).then(() => toast("Copied to the clipboard."), () => toast("Could not copy — your browser blocked it."));
    return;
  }
  if (t.id === "themeBtn") {
    const root = document.documentElement;
    const isDark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", isDark ? "light" : "dark");
    return;
  }
});

document.addEventListener("input", e => {
  const d = e.target.dataset, v = e.target.value;
  if (d.f && editing) {
    if (d.f === "prep.est") editing.prep.est = Number(v) || 0;
    else if (d.f === "prep.done") editing.prep.done = Number(v) || 0;
    else if (d.f === "credits") editing.credits = Number(v) || 0;
    else editing[d.f] = v || (d.f.includes("Date") ? null : v);
    if (d.f === "examDate" || d.f === "estimatedDate" || d.f === "prep.est" || d.f === "prep.done") {
      clearTimeout(window._pr); window._pr = setTimeout(drawEditor, 320);
    }
    return;
  }
  if (d.confirmfield && editing && v) { editing.dateState = "confirmed"; editing.examDate = v; editing.estimatedDate = null; drawEditor(); return; }
  if (d.topicname && editing) { editing.prep.topics[+d.topicname].name = v; return; }
  if (d.dtitle && editing) { editing.deliverables[+d.dtitle].title = v; return; }
  if (d.ddue && editing) { editing.deliverables[+d.ddue].due = v || null; return; }
  if (d.dhours && editing) { editing.deliverables[+d.dhours].hours = Number(v) || 0; return; }
  if (d.cap !== undefined) { state.settings.capacity[+d.cap] = Number(v) || 0; queueSettings(); return; }
  if (d.set) { state.settings[d.set] = d.set === "reserveShare" ? Math.min(0.6, Math.max(0, Number(v) / 100)) : Number(v) || 0; queueSettings(); return; }
  if (d.setlist) { state.settings[d.setlist] = v.split(",").map(x => parseInt(x.trim(), 10)).filter(n => n > 0).sort((a, b) => b - a); queueSettings(); return; }
  if (d.settext) { state.settings[d.settext] = v; queueSettings(true); return; }
});

document.addEventListener("change", e => {
  const d = e.target.dataset;
  if (d.topic !== undefined && editing) { editing.prep.topics[+d.topic].done = e.target.checked; drawEditor(); return; }
  if (d.ddone !== undefined && editing) {
    const item = editing.deliverables[+d.ddone];
    item.done = e.target.checked;
    if (item.done) item.doneHours = item.hours;
    drawEditor(); return;
  }
});

let setTimer = null;
function queueSettings(light) {
  clearTimeout(setTimer);
  setTimer = setTimeout(() => {
    save();
    if (light) { document.getElementById("semLabel").textContent = state.settings.semester; return; }
    // a settings edit changes every derived figure, so redraw — but keep the
    // caret where the user left it
    const a = document.activeElement;
    const key = a && a.dataset ? (a.dataset.cap ?? a.dataset.set ?? a.dataset.setlist ?? a.dataset.settext) : null;
    const attr = a && a.dataset ? (a.dataset.cap !== undefined ? "cap" : a.dataset.set !== undefined ? "set" : a.dataset.setlist !== undefined ? "setlist" : "settext") : null;
    let pos = null; try { pos = a && a.selectionStart; } catch { pos = null; }
    const sc = window.scrollY;
    render();
    window.scrollTo(0, sc);
    if (key != null && attr) {
      const el = document.querySelector(`[data-${attr}="${key}"]`);
      if (el) { el.focus(); if (pos != null) try { el.setSelectionRange(pos, pos); } catch {} }
    }
  }, 500);
}

document.addEventListener("keydown", e => { if (e.key === "Escape" && editing) closeEditor(); });
document.getElementById("scrim").addEventListener("mousedown", e => { if (e.target.id === "scrim") closeEditor(); });

/* chart hover */
document.addEventListener("mousemove", e => {
  const g = e.target.closest?.("#wkchart .wkbar");
  const tip = document.getElementById("wktip");
  if (!tip) return;
  if (!g) { tip.hidden = true; return; }
  const w = M.weeks[+g.dataset.i];
  if (!w) { tip.hidden = true; return; }
  const labels = {}; M.plan.items.forEach(i => labels[i.key] = i);
  const rows = Object.entries(w.parts).sort((a, b) => b[1] - a[1]).slice(0, 5)
    .map(([k, v]) => `<span class="tr"><span>${esc((labels[k]?.name || "").slice(0, 22))}</span><span>${hrs(v)}</span></span>`).join("");
  tip.innerHTML = `<b>Week of ${w.start.getDate()} ${MON[w.start.getMonth()].slice(0, 3)}</b>
    <span class="tr"><span>Assigned</span><span>${hrs(w.total)}</span></span>
    <span class="tr"><span>Capacity</span><span>${hrs(w.capacity)}</span></span>
    ${rows ? `<span style="display:block;height:1px;background:var(--line);margin:6px 0"></span>${rows}` : ""}
    ${w.events.filter(x => x.type !== "due").map(x => `<span class="tr" style="color:var(--crit-ink)"><span>${esc(x.title.slice(0, 20))}</span><span>exam</span></span>`).join("")}`;
  const wrap = document.getElementById("wkchart").getBoundingClientRect();
  tip.hidden = false;
  const tw = tip.offsetWidth;
  tip.style.left = Math.max(4, Math.min(wrap.width - tw - 4, e.clientX - wrap.left + 12)) + "px";
  tip.style.top = Math.max(4, e.clientY - wrap.top - 10) + "px";
});

boot();
</script>
