<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semester Control Deck</title>
<meta name="description" content="Exam and coursework control: three date states, a study planner that allocates real hours, and a logged study-time ledger.">
<meta name="theme-color" content="#0f6e63">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6e63'/%3E%3Cpath d='M8 12h16M11 8v3M21 8v3' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Crect x='7' y='11' width='18' height='15' rx='3' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='19.5' r='2.6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot" aria-hidden="true"></span>
    <span>
      <h1>Semester Control Deck</h1>
      <small id="semLabel">Loading…</small>
    </span>
  </div>
  <div class="clock" id="clock"></div>
  <button class="tbtn" id="paletteBtn" type="button">
    <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    Commands <kbd>Ctrl K</kbd>
  </button>
  <button class="tbtn" id="themeBtn" type="button" aria-label="Switch colour theme">
    <svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    Theme
  </button>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main id="main">
    <div class="boot">Connecting to the deck…</div>
  </main>
</div>

<div id="sheetHost"></div>
<div id="paletteHost"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
